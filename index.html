<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Path of Nine Heavens</title>
  <meta name="description" content="A wuxia cultivation incremental game. Refine Qi, join a sect, survive heavenly tribulation and ascend.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23b53a2a'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%23f4ead2' font-family='serif'%3E道%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Ma+Shan+Zheng&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="seal" aria-hidden="true">问道</span><h1>Path of Nine Heavens</h1></div>
    <div id="heaven" class="heaven"></div>
  </header>
  <main class="layout">
    <section class="dantian" aria-label="Cultivation">
      <div id="identity"></div>
      <div class="well">
        <canvas id="well" width="320" height="320" role="button" tabindex="0" aria-label="Circulate Qi. Click or press space."></canvas>
        <p class="hint">Click the dantian or press space to circulate Qi</p>
      </div>
      <div id="status"></div>
      <div id="encounter"></div>
    </section>
    <section class="work">
      <nav id="tabs" class="tabs" aria-label="Game sections"></nav>
      <div id="panel" class="panel"></div>
    </section>
    <aside class="chronicle" aria-label="Chronicle of events">
      <h2>Chronicle</h2>
      <div id="log" class="log" aria-live="polite"></div>
    </aside>
  </main>
  <div id="overlay"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
